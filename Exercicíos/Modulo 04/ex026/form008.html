<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Meu primeiro Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <fieldset>
            <legend>Calcladora de Multiplicação</legend>
            <p>
                <label for="in1">Número 1:</label>
                <input type="number" name="n1" id="in1" required min="0" max="30" oninput="isoma.innerHTML = Number(in1.value) * Number(in2.value)">
            
            </p>
            <p>
                <label for="in2">Número 2:</label>
                <input type="number" name="n2" id="in2" required min="0" max="30" oninput="isoma.innerHTML = Number(in1.value) * Number(in2.value)">
            </p>
            <p>
                <label for="isoma">Soma</label>
                <output name="soma" id="isoma">0</output>
            </p>
            <p>
                <input type="submit" value="Enviar Dados">
                <input type="reset" value="Limpar Dados">
            </p>
        </fieldset><br>

        <fieldset>
            <legend>Calculadora de idade</legend>
            <p>
                <label for="iano">Ano de nascimento</label>
                <input type="number" name="ano" id="iano" min="1900" max="2026" oninput="calcularIdade()">
            </p>
            <p>
                <label for="iidade">Idade</label>
                <output name="idade" id="iidade">0</output>
            </p>
            <p>
                <input type="submit" value="Enviar Dados">
                <input type="reset" value="Limpar Dados">
            </p>
        </fieldset>

        <script>
            function calcularIdade() {
                let atual = new Date().getFullYear();
                iidade.innerHTML = Number(atual) - Number(iano.value);
            }
        </script>


    </form>
</body>
</html>
