<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body{
            background-color: black;
            color: white;
        }
    </style>

    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <p>
                <input type="radio" name="sexo" id="imasc" value="masculino">
                <label for="imasc">Masculino</label>
            </p>
            <p>
                <input type="radio" name="sexo" id="ifem" value="feminino">
                <label for="ifem">Feminino</label>
            </p>
        </fieldset><br>

        <fieldset>
            <legend>Esporte favorito</legend>
            <p>
                <input type="checkbox" name="Fut" id="ifut">
                <label for="ifut">Futebol</label>
            </p>
            <p>
                <input type="checkbox" name="Fut" id="iten">
                <label for="iten">Tênis</label>
            </p>
            <p>
                <input type="checkbox" name="Basq" id="ibasq">
                <label for="ibasq">Basquete</label>
            </p>
            <p>
                <input type="checkbox" name="Volei" id="ivolei">
                <label for="ivolei">Vôlei</label>
            </p>
        </fieldset>


        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
