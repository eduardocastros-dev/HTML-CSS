<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.container{
            background-color: salmon;
            height: 400px;
            
            display: flex;
            flex-flow: row wrap;
            align-content: space-evenly;
             
            
        }
        div.item{
            background-color: aquamarine;
            padding: 40px;
            border: 1px solid black;
            text-align: center;
            /* margin-right: 5px; -> Não precisa pois usei o justify-content */
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="item">Exemplo de bloco A</div>
        <div class="item">Exemplo de bloco B</div>
        <div class="item">Exemplo de bloco C</div>
        <div class="item">Exemplo de bloco D</div>
        <div class="item">Exemplo de bloco E</div>
        <div class="item">Exemplo de bloco F</div> 
    </div>
</body>
</html>
