<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="inome" required autocomplete="name">
            <input type="reset" value="Limpar">
        </p>
        <p>
            <label for="media">Média</label>
            <input type="number" name="media" id="imedia" required step="0.1" min="0" max="10" value="5.0">
            <input type="reset" value="Limpar">
        </p>
        <p>
            <label for="letivo">Ano letivo</label>
            <input type="month" name="letivo" id="iletivo" required value="2026-01">
        </p>
        <p>
            <label for="dia">Dia do seu nascimento</label>
            <input type="date" name="dia" id="idia" required value="2000-01-01">
        </p>

        <p>
            <input type="submit" value="Enviar">
        </p>

    </form>
</body>
</html>
