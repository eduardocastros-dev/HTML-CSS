<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.container{
            background-color: salmon;
            display: flex;
            height: 100px;
            /* flex-flow: row wrap; */
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        div.item{
            background-color: aquamarine;
            padding: 6px;
            /* margin-right: 5px; -> Não precisa pois usei o justify-content */
            border: 1px solid black;
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="item">Exemplo de bloco A</div>
        <div class="item">Exemplo de bloco B</div>
        <!-- <div class="item">Exemplo de bloco C</div>
        <div class="item">Exemplo de bloco D</div>
        <div class="item">Exemplo de bloco E</div>
        <div class="item">Exemplo de bloco F</div> -->
    </div>
</body>
</html>
