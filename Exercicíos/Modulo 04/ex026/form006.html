<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body{
            background-color: black;
            color: white;
        }
    </style>

    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <fieldset>
            <legend>Selecione sua cor</legend>
            <p>
                <label for="icor">Cor</label>
                <input type="color" name="cor" id="icor">
            </p>
            <p>
                <label for="isat">Nível de satisfação</label>
                <input type="range" name="range" id="isat">
            </p>
            <p>
                <label for="ifoto">Selecione uma foto</label>
                <input type="file" name="foto" id="ifoto">
            </p>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
